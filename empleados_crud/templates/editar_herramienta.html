{% extends 'base.html' %}

{% block content %}

<div>
    <div class="container-formulary">
        <form  class="formulary" action="{% url 'editar_herramienta' herramienta.id %}" method="POST">
            <h2 class="title">Editar Herramienta</h2>
            {% csrf_token %}
            {{ form.as_p }}
            <div class="btn-container">
                <button class="buttons" type="submit">Editar</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
